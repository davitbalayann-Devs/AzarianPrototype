<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Growth OS · Azarian Growth Agency</title>
<script src="../support.js"></script>
<script src="../page-transition.js?v=20260804-6"></script>
<script src="../button.js?v=20260915-1"></script>
<script src="../cursor.js?v=20260723-2"></script>
<script src="../cta.js?v=20260723-2" defer></script>
<script src="../footer.js?v=20260803-2" defer></script>
<script src="../promo-banner.js?v=20260916-6" defer></script>
<script src="../nav.js?v=20260916-2" defer></script>
<script src="../growth-os-page.js?v=20260916-1"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box}
  html{scroll-behavior:smooth;background:#081226;}
  body{margin:0;background:#081226;}
</style>
</helmet>
<div ref="{{ setRoot }}" data-gos-page data-cursor-theme="dark" style="background:transparent;min-height:100vh;color:#fff;font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;position:relative;width:100%;overflow-x:clip;">
  <!-- Sticky webinar banner — shared ./promo-banner.js · Figma 23099:5781 -->
  <div data-promo-banner></div>


  <nav class="agn-nav" data-agn-nav aria-label="Primary"></nav>

  <main data-gos-mount></main>

  <section id="cta" data-agn-cta data-cursor-theme="dark"></section>
  <footer class="ft" data-agn-footer data-cursor-theme="dark"></footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  setRoot = (el) => { this.rootEl = el; };

  componentDidMount() {
    if (window.AGA_GROWTH_OS_PAGE && this.rootEl) {
      window.AGA_GROWTH_OS_PAGE.build(this.rootEl);
    }
  }

  componentWillUnmount() {
    if (window.AGA_GROWTH_OS_PAGE && this.rootEl) {
      window.AGA_GROWTH_OS_PAGE.destroy(this.rootEl);
    }
  }

  renderVals() {
    return { setRoot: this.setRoot };
  }
}
</script>
</body>
</html>
